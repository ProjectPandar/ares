<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ares project slicing browser smoke</title>
  </head>
  <body>
    <script type="module">
      import init, { sliceProject } from "/target/wasm-browser/ares_wasm.js";

      await init();
      window.sliceFixtureProject = async () => {
        const response = await fetch(
          "/tests/ksr_fdmtest_v4/ksr_fdmtest_v4.project.3mf",
        );
        const input = new Uint8Array(await response.arrayBuffer());
        try {
          await sliceProject(input);
          return { resolved: true };
        } catch (error) {
          return { resolved: false, error: String(error) };
        }
      };
      window.aresReady = true;
    </script>
  </body>
</html>

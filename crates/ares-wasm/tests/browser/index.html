<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ares project slicing browser smoke</title>
  </head>
  <body>
    <script type="module">
      import init, * as bindings from "/target/wasm-browser/ares_wasm.js";

      await init();
      const {
        sliceProject,
        task22iBrowserInputOracle,
        task22iBrowserOracle,
      } = bindings;
      const encoder = new TextEncoder();
      const magicH = encoder.encode("ARES22H\0");
      const magicI = encoder.encode("ARES22I\0");

      function checkpointBytes(input) {
        return input instanceof Uint8Array ? input : new Uint8Array(input);
      }

      function parseCheckpoint(input) {
        const bytes = checkpointBytes(input);
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        let cursor = 0;

        const requireBytes = (length) => {
          if (cursor + length > bytes.length) {
            throw new Error("truncated ARES22 checkpoint stream");
          }
        };
        const readU8 = () => {
          requireBytes(1);
          return view.getUint8(cursor++);
        };
        const readU32 = () => {
          requireBytes(4);
          const value = view.getUint32(cursor, true);
          cursor += 4;
          return value;
        };
        const readCount = () => {
          requireBytes(8);
          const value = view.getBigUint64(cursor, true);
          cursor += 8;
          if (value > BigInt(Number.MAX_SAFE_INTEGER)) {
            throw new Error("ARES22 count exceeds JavaScript's safe range");
          }
          return Number(value);
        };
        const readPolygon = () => {
          const points = readCount();
          requireBytes(points * 16);
          cursor += points * 16;
          return points;
        };
        const hasMagic = (magic) =>
          magic.every((expected, index) => bytes[index] === expected);

        requireBytes(magicH.length);
        const magic = hasMagic(magicH)
          ? "ARES22H\0"
          : hasMagic(magicI)
            ? "ARES22I\0"
            : null;
        if (magic === null) {
          throw new Error("invalid ARES22 checkpoint magic");
        }
        cursor += magicH.length;

        const objects = readCount();
        const modes = [0, 0, 0, 0];
        const ownership = [];
        const layerRecords = [];
        let volumes = 0;
        let layers = 0;
        let contours = 0;
        let holes = 0;
        let points = 0;
        for (let object = 0; object < objects; object += 1) {
          const sourceObject = readCount();
          const transform = readCount();
          const plannedLayers = readCount();
          const objectVolumes = readCount();
          volumes += objectVolumes;
          for (let volume = 0; volume < objectVolumes; volume += 1) {
            const sourceVolume = readCount();
            const ordinal = readU32();
            const volumeType = readU8();
            ownership.push([
              sourceObject,
              transform,
              plannedLayers,
              sourceVolume,
              ordinal,
              volumeType,
            ]);
            const volumeLayers = readCount();
            layers += volumeLayers;
            for (let layer = 0; layer < volumeLayers; layer += 1) {
              const start = cursor;
              const index = readCount();
              const mode = readU8();
              if (mode >= modes.length) {
                throw new Error("invalid ARES22 slicing mode");
              }
              modes[mode] += 1;
              const layerContours = readCount();
              contours += layerContours;
              for (let contour = 0; contour < layerContours; contour += 1) {
                points += readPolygon();
                const contourHoles = readCount();
                holes += contourHoles;
                for (let hole = 0; hole < contourHoles; hole += 1) {
                  points += readPolygon();
                }
              }
              layerRecords.push({ index, mode, start, end: cursor });
            }
          }
        }
        if (cursor !== bytes.length) {
          throw new Error("ARES22 checkpoint stream has trailing bytes");
        }

        return {
          magic,
          byteLength: bytes.length,
          bytesRead: cursor,
          objects,
          volumes,
          layers,
          contours,
          holes,
          points,
          modes,
          ownership,
          layerRecords,
        };
      }

      async function sha256(bytes) {
        const digest = await crypto.subtle.digest(
          "SHA-256",
          checkpointBytes(bytes),
        );
        return Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }

      function byteEqual(left, right) {
        return (
          left.length === right.length &&
          left.every((byte, index) => byte === right[index])
        );
      }

      function bodyEqualExceptMagic(left, right) {
        return (
          left.length === right.length &&
          left.every(
            (byte, index) => index === 6 || byte === right[index],
          ) &&
          left[6] === "H".charCodeAt(0) &&
          right[6] === "I".charCodeAt(0)
        );
      }

      async function summarize(bytes) {
        const { layerRecords, ...parsed } = parseCheckpoint(bytes);
        return {
          ...parsed,
          sha256: await sha256(bytes),
        };
      }

      function layerBytes(bytes, record) {
        return bytes.subarray(record.start, record.end);
      }

      function sameOwnership(left, right) {
        return (
          JSON.stringify(left.ownership) === JSON.stringify(right.ownership) &&
          left.layerRecords.length === right.layerRecords.length &&
          left.layerRecords.every(
            (record, slot) =>
              record.index === right.layerRecords[slot].index &&
              record.mode === right.layerRecords[slot].mode,
          )
        );
      }

      async function recordSummaries(bytes, parsed, slots) {
        return Promise.all(
          slots.map(async (slot) => {
            const record = layerBytes(bytes, parsed.layerRecords[slot]);
            return { slot, byteLength: record.length, sha256: await sha256(record) };
          }),
        );
      }

      async function fixtureBytes(input) {
        if (input !== undefined) {
          return checkpointBytes(input);
        }
        const response = await fetch(
          "/tests/ksr_fdmtest_v4/ksr_fdmtest_v4.project.3mf",
        );
        return new Uint8Array(await response.arrayBuffer());
      }

      window.sliceFixtureProject = async () => {
        try {
          await sliceProject(await fixtureBytes());
          return { resolved: true };
        } catch (error) {
          return { resolved: false, error: String(error) };
        }
      };
      window.parseTask22Vector = (bytes) => {
        const { layerRecords, ...parsed } = parseCheckpoint(bytes);
        return parsed;
      };
      window.sha256Text = (text) => sha256(encoder.encode(text));
      window.task22iBindingExports = Object.keys(bindings).sort();
      window.task22iFixtureOracles = async (input) => {
        const project = await fixtureBytes(input);
        const inputFirst = checkpointBytes(
          await task22iBrowserInputOracle(project),
        );
        const inputSecond = checkpointBytes(
          await task22iBrowserInputOracle(project),
        );
        const outputFirst = checkpointBytes(await task22iBrowserOracle(project));
        const outputSecond = checkpointBytes(await task22iBrowserOracle(project));
        const inputParsed = parseCheckpoint(inputFirst);
        const outputParsed = parseCheckpoint(outputFirst);
        const changedSlots = inputParsed.layerRecords
          .map((record, slot) =>
            byteEqual(
              layerBytes(inputFirst, record),
              layerBytes(outputFirst, outputParsed.layerRecords[slot]),
            )
              ? null
              : slot,
          )
          .filter((slot) => slot !== null);
        return {
          input: await summarize(inputFirst),
          output: await summarize(outputFirst),
          outputRecords: await recordSummaries(
            outputFirst,
            outputParsed,
            [0, 46, 49, 459],
          ),
          changedSlots,
          changedSlotSha256:
            changedSlots.length === 0
              ? null
              : await sha256(encoder.encode(changedSlots.join(","))),
          inputRepeatable: byteEqual(inputFirst, inputSecond),
          outputRepeatable: byteEqual(outputFirst, outputSecond),
          ownershipEqual: sameOwnership(inputParsed, outputParsed),
          bodyEqualExceptMagic: bodyEqualExceptMagic(inputFirst, outputFirst),
        };
      };
      window.task22iOutputsEqual = async (left, right) =>
        byteEqual(
          checkpointBytes(await task22iBrowserOracle(await fixtureBytes(left))),
          checkpointBytes(await task22iBrowserOracle(await fixtureBytes(right))),
        );
      window.aresReady = true;
    </script>
  </body>
</html>

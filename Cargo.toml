[workspace]
members = [
    "crates/ares-core",
    "crates/ares-cli",
    "crates/ares-vgcode",
    "crates/ares-wasm",
]
resolver = "2"

[workspace.package]
rust-version = "1.91.0"

[workspace.dependencies]
boostvoronoi = { version = "=0.12.1", default-features = false }
quick-xml = { version = "0.41.0", default-features = false, features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3.98"
jiff = "0.2.32"
syn = { version = "2.0.118", features = ["full", "visit", "extra-traits"] }
toml = "1.1.2"
walkdir = "2.5.0"
clap = { version = "4.5", features = ["derive"] }
assert_cmd = "2.0"
predicates = "3.1"
regex = "1.13.0"
sha2 = "0.11.0"
tempfile = "3.14"
tokio = { version = "1.48", features = ["macros", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.test]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[workspace]
members = [
    "crates/ares-core",
    "crates/ares-cli",
    "crates/ares-vgcode",
    "crates/ares-wasm",
]
resolver = "2"
exclude = ["spikes/plugin-runtime"]

[workspace.package]
version = "0.1.68"
rust-version = "1.99.0"

[workspace.dependencies]
boostvoronoi = { version = "=0.12.1", default-features = false }
quick-xml = { version = "0.41.0", default-features = false, features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2.32"
clap = { version = "4.5", features = ["derive"] }
assert_cmd = "2.0"
predicates = "3.1"
proptest = { version = "1.9", default-features = false, features = ["std"] }
rayon = "1.10"
regex = { version = "1.13.0", default-features = false, features = ["std", "perf"] }
md-5 = "0.10.6"
sha2 = "0.11.0"
tempfile = "3.14"
tokio = { version = "1.48", features = ["macros", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.test.package.ares-core]
opt-level = 2

[profile.test.package.ares-vgcode]
opt-level = 2

[profile.test.package.boostvoronoi]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[patch.crates-io]
boostvoronoi = { path = "vendor/boostvoronoi" }

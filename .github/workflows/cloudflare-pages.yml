name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ORCA_REF: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
  CARGO_INCREMENTAL: "0"

jobs:
  pages-build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Select PR scope
        id: select
        run: |
          bash scripts/ci/select-pr-checks.sh \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Skip Pages build when PR diff does not reach web or WASM
        if: steps.select.outputs.run_web != 'true'
        run: echo "PR diff (${{ steps.select.outputs.reason }}) does not reach web or WASM; full suite runs in merge_group."
      - name: Setup pinned Bun canary
        if: steps.select.outputs.run_web == 'true'
        uses: ./.github/actions/setup-bun
      - name: Checkout sparse OrcaSlicer
        if: steps.select.outputs.run_web == 'true'
        uses: ./.github/actions/checkout-orca-sparse
        with:
          ref: ${{ env.ORCA_REF }}
      - name: Cache web node_modules
        id: web-deps
        if: steps.select.outputs.run_web == 'true'
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/app/node_modules
            web/packages/ares-profiles/node_modules
            web/packages/ares-wasm-js/node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Install web dependencies
        if: steps.select.outputs.run_web == 'true' && steps.web-deps.outputs.cache-hit != 'true'
        run: bun install --cwd web --frozen-lockfile
      - name: Cache content-addressed WASM package output
        id: wasm-pkg
        if: steps.select.outputs.run_web == 'true' && github.event_name != 'merge_group'
        uses: actions/cache@v4
        with:
          path: web/packages/ares-wasm-js/src/wasm
          key: ares-wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/ares-core/**', 'crates/ares-vgcode/**', 'crates/ares-wasm/**', 'vendor/**', 'web/packages/ares-wasm-js/scripts/build-wasm.mjs') }}
      - name: Setup Rust wasm32 toolchain
        if: steps.select.outputs.run_web == 'true' && (steps.wasm-pkg.outputs.cache-hit != 'true' || github.event_name == 'merge_group')
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Setup wasm-bindgen CLI
        if: steps.select.outputs.run_web == 'true' && (steps.wasm-pkg.outputs.cache-hit != 'true' || github.event_name == 'merge_group')
        uses: taiki-e/install-action@wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.121
      - name: Restore Rust cache for WASM build
        if: steps.select.outputs.run_web == 'true' && (steps.wasm-pkg.outputs.cache-hit != 'true' || github.event_name == 'merge_group')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pages-wasm"
      - name: Build WASM package
        if: steps.select.outputs.run_web == 'true' && (steps.wasm-pkg.outputs.cache-hit != 'true' || github.event_name == 'merge_group')
        run: bun run --cwd web build:wasm
      - name: Build web app and package Pages bundle
        if: steps.select.outputs.run_web == 'true'
        run: |
          bun run --cwd web build
          bun web/scripts/package-pages.mjs
      - name: Format, lint, typecheck, and unit test web
        if: steps.select.outputs.run_web == 'true' && github.event_name != 'push'
        run: |
          bun run --cwd web fmt:check
          bun run --cwd web lint
          bun run --cwd web typecheck
          mkdir -p "$RUNNER_TEMP/profile-tests"
          ORCA_SLICER_DIR="$PWD/OrcaSlicer" \
          ARES_PROFILE_TEST_ARTIFACTS="$RUNNER_TEMP/profile-tests" \
            bun run --cwd web test:unit
      - name: Cache Playwright Chromium
        id: pw-cache
        if: steps.select.outputs.run_web == 'true' && github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Install Playwright Chromium on cache miss
        if: steps.select.outputs.run_web == 'true' && github.event_name != 'push' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx --cwd web playwright install chromium
      - name: Run Pages Playwright suite
        if: steps.select.outputs.run_web == 'true' && github.event_name != 'push'
        run: bun run --cwd web test:pages
      - name: Cache Pages dist for main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: web/app/dist
          key: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: pages-build
    runs-on: ubuntu-latest
    environment: cloudflare-pages-production
    steps:
      - name: Restore built Pages dist
        uses: actions/cache/restore@v4
        with:
          path: web/app/dist
          key: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Require Cloudflare Pages project variable
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: test -n "$PROJECT"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          command: pages deploy web/app/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pages-build:
    name: pages-build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/projectpandar/ares/ci-toolchain:browsers-1e03abfd9400
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
          path: OrcaSlicer
          filter: blob:none
          persist-credentials: false
          sparse-checkout: resources/profiles
      - uses: Swatinem/rust-cache@v2
      - name: Cache web node_modules
        id: web-deps
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/app/node_modules
            web/packages/ares-profiles/node_modules
            web/packages/ares-wasm-js/node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Install web dependencies
        if: steps.web-deps.outputs.cache-hit != 'true'
        run: bun install --cwd web --frozen-lockfile
      - name: Build Pages bundle
        run: bun run --cwd web build:pages
      - name: Format, lint, and typecheck web
        run: |
          bun run --cwd web fmt:check
          bun run --cwd web lint
          bun run --cwd web typecheck
      - name: Run web unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/profile-tests"
          ORCA_SLICER_DIR="$PWD/OrcaSlicer" \
          ARES_PROFILE_TEST_ARTIFACTS="$RUNNER_TEMP/profile-tests" \
            bun run --cwd web test:unit
      - name: Run Pages Playwright suite
        run: bun run --cwd web test:pages
      - name: Cache Pages dist for main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: web/app/dist
          key: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: pages-build
    runs-on: ubuntu-latest
    environment: cloudflare-pages-production
    steps:
      - name: Restore built Pages dist
        uses: actions/cache/restore@v4
        with:
          path: web/app/dist
          key: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Require Cloudflare Pages project variable
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: test -n "$PROJECT"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          command: pages deploy web/app/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

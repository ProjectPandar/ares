name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages-build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
          path: OrcaSlicer
          persist-credentials: false
          sparse-checkout: resources/profiles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep -m1 'version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: npm ci --prefix web
      - run: npm run build:pages --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('web/package-lock.json') }}
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm run test:pages --prefix web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: pages-build
    runs-on: ubuntu-latest
    environment: cloudflare-pages-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
          path: OrcaSlicer
          persist-credentials: false
          sparse-checkout: resources/profiles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep -m1 'version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: npm ci --prefix web
      - run: npm run build:pages --prefix web
      - name: Require Cloudflare Pages project variable
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: test -n "$PROJECT"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          command: pages deploy web/app/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

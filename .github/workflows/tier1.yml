name: Tier 1

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_REF: 8500fcdccaa10b5099ac20d252af3a7c560046f1 # OrcaSlicer v2.4.2

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
      - name: Verify runtime GLU oracle prerequisites
        run: |
          command -v gcc
          command -v g++
          test -f OrcaSlicer/deps_src/glu-libtess/src/tess.c
          test -f OrcaSlicer/deps_src/glu-libtess/include/glu-libtess.h
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  native-oracle-build:
    name: oracle-${{ matrix.variant }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        variant:
          - merged-oracle
          - ksr-initialized
          - seed-replay
          - procgcode
          - procgcode-stable-options
          - procgcode-dynamics
          - print-statistics
          - plate-custom-gcodes
          - custom-gcode-overview
          - actual-speed-profile
          - role-times
          - segment-hw
          - segment-colors
          - patchelf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
      - run: bash scripts/ci/build-oracle.sh ${{ matrix.variant }}

  web:
    runs-on: self-hosted
    needs: native-oracle-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
            src/libvgcode
            src/slic3r/GUI/LibVGCode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      # wasm-bindgen-cli must match the crate's schema version exactly.
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep -m1 'version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: Swatinem/rust-cache@v2
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
      - name: Substitute Native oracles
        run: |
          set -euo pipefail
          export ORACLE_SUBSTITUTE_ONLY=1
          for v in merged-oracle ksr-initialized procgcode procgcode-dynamics print-statistics plate-custom-gcodes custom-gcode-overview actual-speed-profile role-times segment-hw segment-colors patchelf; do
            out="$(bash scripts/ci/build-oracle.sh "$v" | tail -1)"
            name="ORACLE_${v//-/_}"; echo "$name=$out" >> "$GITHUB_ENV"
            echo "$v -> $out"
          done
      - name: Fetch official OrcaSlicer AppImage
        run: bash scripts/ci/fetch-orca-appimage.sh "$RUNNER_TEMP/orca-appdir"
      - name: Export oracle env
        run: |
          set -euo pipefail
          nixpkgs="$(nix eval --raw --expr '(builtins.getFlake "github:NixOS/nixpkgs/dc56dcbed57fa354b45a3a68a4eedd74663ae5ce").outPath')"
          ksr="$ORACLE_ksr_initialized"
          {
            echo "NIX_PATH=nixpkgs=$nixpkgs"
            echo "ORCA_SLICER_DIR=$PWD/OrcaSlicer/"
            echo "ORCA_APPDIR=$RUNNER_TEMP/orca-appdir"
            echo "ORCA_JOB_APPDIR=$RUNNER_TEMP/orca-patched-appdir"
            echo "ORCA_PATCHELF=$ORACLE_patchelf/bin/patchelf"
            echo "ORCA_REPLAY_SEED=0"
            echo "ARES_KSR_INITIALIZED_BIN=$ksr/bin/orca-slicer"
            echo "ARES_KSR_INITIALIZED_NATIVE_BIN=$ksr/bin/.orca-slicer-wrapped"
            echo "ARES_KSR_INITIALIZED_RESOURCES_DIR=$ksr/share/OrcaSlicer"
            echo "ARES_WASM_PKG=$PWD/target/wasm-browser"
            echo "ARES_PROCGCODE_BIN=$ORACLE_procgcode/bin/orca-slicer"
            echo "ARES_PROCGCODE_DYNAMICS_BIN=$ORACLE_procgcode_dynamics/bin/orca-slicer"
            echo "ARES_PRINT_STATISTICS_BIN=$ORACLE_print_statistics/bin/orca-slicer"
            echo "ARES_PLATE_CUSTOM_GCODES_BIN=$ORACLE_plate_custom_gcodes/bin/orca-slicer"
            echo "ARES_CUSTOM_GCODE_OVERVIEW_BIN=$ORACLE_custom_gcode_overview/bin/orca-slicer"
            echo "ARES_ACTUAL_SPEED_PROFILE_BIN=$ORACLE_actual_speed_profile/bin/orca-slicer"
            echo "ARES_ROLE_TIMES_BIN=$ORACLE_role_times/bin/orca-slicer"
            echo "ARES_SEGMENT_HW_BIN=$ORACLE_segment_hw/bin/orca-slicer"
            echo "ARES_SEGMENT_COLOR_BIN=$ORACLE_segment_colors/bin/orca-slicer"
            echo "ARES_MARKER_TIME_BIN=$ORACLE_merged_oracle/bin/orca-slicer"
            echo "ARES_MARKER_TIME_STABLE_BIN=$ORACLE_merged_oracle/bin/orca-slicer"
            echo "ARES_PARITY_ARTIFACT_ROOT=$RUNNER_TEMP/parity-artifacts"
            echo "LC_ALL=C.UTF-8"
            echo "LOCALE_ARCHIVE=$( NIX_PATH=nixpkgs=$nixpkgs nix eval --impure --raw --expr '(import <nixpkgs> { system = "x86_64-linux"; }).glibcLocales.outPath')/lib/locale/locale-archive"
          } >> "$GITHUB_ENV"
      - name: Verify generated PrintConfigDef metadata is in sync with upstream
        run: |
          node scripts/gen-configdef.mjs --check
          mkdir -p target
          cargo run -p ares-core --release --example print_config_def > target/print-config-def.json
          node scripts/verify-configdef.mjs target/print-config-def.json --report target/configdef-verification.json
      - run: cargo check -p ares-core --target wasm32-unknown-unknown
      - run: cargo check -p ares-wasm --target wasm32-unknown-unknown
      - run: cargo build -p ares-wasm --target wasm32-unknown-unknown --release --target-dir target/wasm-browser
      - run: wasm-bindgen target/wasm-browser/wasm32-unknown-unknown/release/ares_wasm.wasm --target web --out-dir target/wasm-browser
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium webkit
      - run: npm run lint --prefix web
      - run: npm run build:wasm --prefix web/packages/ares-wasm-js
      - run: npm run build --prefix web
      - run: npm run typecheck --prefix web
      - uses: ./.github/actions/web-e2e

  parity-seeded:
    runs-on: self-hosted
    needs: native-oracle-build
    env:
      ARES_REQUIRE_ORCA: "1"
      ARES_PARITY_SEEDED_REFERENCE: "1"
      ARES_ROLE_ORACLE_LIVE: "1"
      ARES_PARITY_BOOKKEEPING_REFERENCE: "1"
      ARES_PARITY_BRIDGE_DIRECTION_REFERENCE: "1"
      ARES_PARITY_CLIPPED_LOOP_REFERENCE: "1"
      ARES_PARITY_EMISSION_PHASES_REFERENCE: "1"
      ARES_PARITY_FILAMENT_STATS_REFERENCE: "1"
      ARES_PARITY_FILAMENT_VARIANTS_REFERENCE: "1"
      ARES_PARITY_HONEYCOMB_MULTILINE: "1"
      ARES_PARITY_IRONING_FAN_REFERENCE: "1"
      ARES_PARITY_LIGHTNING_REFERENCE: "1"
      ARES_PARITY_LOOP_CHAIN_REFERENCE: "1"
      ARES_PARITY_MULTIOBJECT_SKIRT_REFERENCE: "1"
      ARES_PARITY_NORMAL_SUPPORT_REFERENCE: "1"
      ARES_PARITY_OBJECT_ID_REFERENCE: "1"
      ARES_PARITY_OVERHANG_INTERSECTION_REFERENCE: "1"
      ARES_PARITY_OVERRIDE_REFERENCE: "1"
      ARES_PARITY_PROFILE_ENTRY_REFERENCE: "1"
      ARES_PARITY_REGION_FILAMENT_REFERENCE: "1"
      ARES_PARITY_REGION_PERIMETERS_REFERENCE: "1"
      ARES_PARITY_SHORT_LINE_REFERENCE: "1"
      ARES_PARITY_SMALL_LOOP_SPEED_REFERENCE: "1"
      ARES_PARITY_STITCH_JUNCTION_REFERENCE: "1"
      ARES_PARITY_SUPPORT_ANGLE_REFERENCE: "1"
      ARES_PARITY_SUPPORT_ANNOTATIONS_REFERENCE: "1"
      ARES_PARITY_SUPPORT_FLOW_REFERENCE: "1"
      ARES_PARITY_SUPPORT_MODIFIER_REFERENCE: "1"
      ARES_PARITY_SUPPORT_STYLE_REFERENCE: "1"
      ARES_PARITY_TRANSITION_SNAP_REFERENCE: "1"
      ARES_PARITY_TREE_CONTAINMENT_REFERENCE: "1"
      ARES_PARITY_TREE_SUPPORT_REFERENCE: "1"
      ARES_PARITY_VOLUME_OFFSETS_REFERENCE: "1"
      ARES_PARITY_WIDTH_OWNER_PAIR: "1"
      ORCA_REPLAY_SEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
      - name: Substitute Native oracles
        run: |
          set -euo pipefail
          export ORACLE_SUBSTITUTE_ONLY=1
          for v in merged-oracle ksr-initialized gdb seed-replay procgcode procgcode-stable-options procgcode-dynamics print-statistics plate-custom-gcodes custom-gcode-overview; do
            out="$(bash scripts/ci/build-oracle.sh "$v" | tail -1)"
            name="ORACLE_${v//-/_}"; echo "$name=$out" >> "$GITHUB_ENV"
            echo "$v -> $out"
          done
      - name: Export oracle env
        run: |
          set -euo pipefail
          nixpkgs="$(nix eval --raw --expr '(builtins.getFlake "github:NixOS/nixpkgs/dc56dcbed57fa354b45a3a68a4eedd74663ae5ce").outPath')"
          ksr="$ORACLE_ksr_initialized"
          {
            echo "NIX_PATH=nixpkgs=$nixpkgs"
            echo "ARES_ORCA_BIN=$PWD/scripts/orca-seeded-parity.sh"
            echo "ORCA_REPLAY_BIN=$ORACLE_seed_replay/bin/orca-slicer"
            echo "ARES_ORCA_REFERENCE_BINARY=$ORACLE_seed_replay/bin/.orca-slicer-wrapped"
            echo "ARES_ORCA_NATIVE_BIN=$ksr/bin/.orca-slicer-wrapped"
            echo "ARES_ORCA_RESOURCES_DIR=$ksr/share/OrcaSlicer"
            echo "ARES_KSR_INITIALIZED_BIN=$ksr/bin/orca-slicer"
            echo "ARES_KSR_INITIALIZED_NATIVE_BIN=$ksr/bin/.orca-slicer-wrapped"
            echo "ARES_KSR_INITIALIZED_RESOURCES_DIR=$ksr/share/OrcaSlicer"
            echo "ARES_PROCGCODE_BIN=$ORACLE_procgcode/bin/orca-slicer"
            echo "ARES_PROCGCODE_STABLE_BIN=$ORACLE_procgcode_stable_options/bin/orca-slicer"
            echo "ARES_PROCGCODE_DYNAMICS_BIN=$ORACLE_procgcode_dynamics/bin/orca-slicer"
            echo "ARES_PROCGCODE_NATIVE_BIN=$ORACLE_procgcode/bin/.orca-slicer-wrapped"
            echo "ARES_PRINT_STATISTICS_BIN=$ORACLE_print_statistics/bin/orca-slicer"
            echo "ARES_PLATE_CUSTOM_GCODES_BIN=$ORACLE_plate_custom_gcodes/bin/orca-slicer"
            echo "ARES_CUSTOM_GCODE_OVERVIEW_BIN=$ORACLE_custom_gcode_overview/bin/orca-slicer"
            echo "ARES_GDB_BIN=$ORACLE_gdb/bin/gdb"
            echo "ARES_PARITY_ARTIFACT_ROOT=$RUNNER_TEMP/parity-artifacts"
            echo "LC_ALL=C.UTF-8"
            echo "LOCALE_ARCHIVE=$( NIX_PATH=nixpkgs=$nixpkgs nix eval --impure --raw --expr '(import <nixpkgs> { system = "x86_64-linux"; }).glibcLocales.outPath')/lib/locale/locale-archive"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$PWD/scripts/ci/pin-runner.sh"
          } >> "$GITHUB_ENV"
      - name: Verify runtime GLU oracle prerequisites
        run: |
          command -v gcc
          command -v g++
          test -f OrcaSlicer/deps_src/glu-libtess/src/tess.c
          test -f OrcaSlicer/deps_src/glu-libtess/include/glu-libtess.h
      - name: Compare GLU tessellation against runtime Native supplier
        run: cargo nextest run -p ares-core --lib --no-fail-fast -E 'test(/^geometry::tessellation::tests::/)' --test-threads 2
      - run: cargo nextest run -p ares-cli --test orca_parity --no-fail-fast --test-threads 8

  parity-official:
    runs-on: self-hosted
    needs: native-oracle-build
    env:
      ARES_REQUIRE_ORCA: "1"
      ARES_ROLE_ORACLE_LIVE: "1"
      ARES_PARITY_BOOKKEEPING_REFERENCE: "1"
      ARES_PARITY_BRIDGE_DIRECTION_REFERENCE: "1"
      ARES_PARITY_CLIPPED_LOOP_REFERENCE: "1"
      ARES_PARITY_EMISSION_PHASES_REFERENCE: "1"
      ARES_PARITY_FILAMENT_STATS_REFERENCE: "1"
      ARES_PARITY_FILAMENT_VARIANTS_REFERENCE: "1"
      ARES_PARITY_HONEYCOMB_MULTILINE: "1"
      ARES_PARITY_IRONING_FAN_REFERENCE: "1"
      ARES_PARITY_LIGHTNING_REFERENCE: "1"
      ARES_PARITY_LOOP_CHAIN_REFERENCE: "1"
      ARES_PARITY_MULTIOBJECT_SKIRT_REFERENCE: "1"
      ARES_PARITY_NORMAL_SUPPORT_REFERENCE: "1"
      ARES_PARITY_OBJECT_ID_REFERENCE: "1"
      ARES_PARITY_OVERHANG_INTERSECTION_REFERENCE: "1"
      ARES_PARITY_OVERRIDE_REFERENCE: "1"
      ARES_PARITY_PROFILE_ENTRY_REFERENCE: "1"
      ARES_PARITY_REGION_FILAMENT_REFERENCE: "1"
      ARES_PARITY_REGION_PERIMETERS_REFERENCE: "1"
      ARES_PARITY_SHORT_LINE_REFERENCE: "1"
      ARES_PARITY_SMALL_LOOP_SPEED_REFERENCE: "1"
      ARES_PARITY_STITCH_JUNCTION_REFERENCE: "1"
      ARES_PARITY_SUPPORT_ANGLE_REFERENCE: "1"
      ARES_PARITY_SUPPORT_ANNOTATIONS_REFERENCE: "1"
      ARES_PARITY_SUPPORT_FLOW_REFERENCE: "1"
      ARES_PARITY_SUPPORT_MODIFIER_REFERENCE: "1"
      ARES_PARITY_SUPPORT_STYLE_REFERENCE: "1"
      ARES_PARITY_TRANSITION_SNAP_REFERENCE: "1"
      ARES_PARITY_TREE_CONTAINMENT_REFERENCE: "1"
      ARES_PARITY_TREE_SUPPORT_REFERENCE: "1"
      ARES_PARITY_VOLUME_OFFSETS_REFERENCE: "1"
      ARES_PARITY_WIDTH_OWNER_PAIR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3

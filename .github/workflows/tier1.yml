name: Tier 1

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ORCA_REF: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  native-nonparity:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/projectpandar/ares/ci-toolchain:base-1e03abfd9400
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          filter: blob:none
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
            src/OrcaSlicer.cpp
          persist-credentials: false
      - name: Verify runtime GLU and configuration metadata prerequisites
        run: |
          set -euo pipefail
          command -v gcc
          command -v g++
          test -f OrcaSlicer/deps_src/glu-libtess/src/tess.c
          test -f OrcaSlicer/deps_src/glu-libtess/include/glu-libtess.h
          test "$(git -C OrcaSlicer rev-parse HEAD)" = "$ORCA_REF"
          test -f OrcaSlicer/src/OrcaSlicer.cpp
          for file in PrintConfig.cpp PrintConfig.hpp PrintConfigConstants.hpp MaterialType.cpp Preset.cpp; do
            test -f "OrcaSlicer/src/libslic3r/$file"
          done
          context_artifacts=$(mktemp -d "$RUNNER_TEMP/configdef-context.XXXXXXXX")
          enum_artifacts=$(mktemp -d "$RUNNER_TEMP/enum.XXXXXXXX")
          printf 'ARES_CONFIGDEF_CONTEXT_ARTIFACTS=%s\nARES_ENUM_ARTIFACTS=%s\n' \
            "$context_artifacts" "$enum_artifacts" >> "$GITHUB_ENV"
      - name: Verify generated PrintConfigDef source is in sync
        run: bun scripts/gen-configdef.mjs --check
      - name: Check wasm32 targets
        run: cargo check --target wasm32-unknown-unknown -p ares-core -p ares-wasm
      - name: Run non-parity workspace tests without compiling orca_parity
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, subprocess
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          other_pkgs = []
          cli_args = ["-p", "ares-cli"]
          for pkg in meta["packages"]:
              if pkg["name"] != "ares-cli":
                  other_pkgs.extend(["-p", pkg["name"]])
              else:
                  kinds = {k for t in pkg["targets"] for k in t["kind"]}
                  if "lib" in kinds:
                      cli_args.append("--lib")
                  if "bin" in kinds:
                      cli_args.append("--bins")
                  for target in pkg["targets"]:
                      if "test" in target["kind"] and target["name"] != "orca_parity":
                          cli_args.extend(["--test", target["name"]])
          if other_pkgs:
              subprocess.check_call(["cargo", "nextest", "run", "--no-fail-fast", *other_pkgs])
          if len(cli_args) > 2:
              subprocess.check_call(["cargo", "nextest", "run", "--no-fail-fast", *cli_args])
          PYEOF
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-parity:
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/projectpandar/ares/ci-toolchain:base-1e03abfd9400
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Build and archive orca_parity test binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-archive"
          cargo nextest archive -p ares-cli --test orca_parity \
            --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst"
          ls -lh "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/parity-archive
          key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}

  parity-official:
    name: parity-official (${{ matrix.shard }}/8)
    needs: build-parity
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: ./.github/actions/setup-parity-shard
        with:
          mode: official
          archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
          ghcr-token: ${{ github.token }}
      - name: Run parity-official shard ${{ matrix.shard }}/8
        run: |
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast --test-threads 4 \
            --profile parity-official \
            --partition "hash:${{ matrix.shard }}/8"

  parity-seeded:
    name: parity-seeded (${{ matrix.shard }}/8)
    needs: build-parity
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: ./.github/actions/setup-parity-shard
        with:
          mode: seeded
          archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
          ghcr-token: ${{ github.token }}
      - name: Run parity-seeded shard ${{ matrix.shard }}/8
        run: |
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast --test-threads 4 \
            --profile parity-seeded \
            --partition "hash:${{ matrix.shard }}/8"

  web-build:
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/projectpandar/ares/ci-toolchain:base-1e03abfd9400
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SoftFever/OrcaSlicer
          ref: ${{ env.ORCA_REF }}
          path: OrcaSlicer
          filter: blob:none
          sparse-checkout: |
            resources/profiles
            src/libslic3r
            deps_src/glu-libtess
            src/libvgcode
            src/slic3r/GUI/LibVGCode
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Cache web node_modules
        id: web-deps
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/app/node_modules
            web/packages/ares-profiles/node_modules
            web/packages/ares-wasm-js/node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Install web dependencies
        if: steps.web-deps.outputs.cache-hit != 'true'
        run: bun install --cwd web --frozen-lockfile
      - name: Build release CLI and print_config_def in one Cargo invocation
        run: cargo build --release -p ares-cli --bin ares -p ares-core --example print_config_def
      - name: Verify generated PrintConfigDef metadata
        run: |
          bun scripts/gen-configdef.mjs --check
          ./target/release/examples/print_config_def > target/print-config-def.json
          bun scripts/verify-configdef.mjs target/print-config-def.json --report target/configdef-verification.json
      - name: Generate ares-wasm E2E fixtures and panic probe
        run: |
          cargo nextest run -p ares-wasm --test compatible_presets --test decoded_settings --test encode_roundtrip
          bun web/scripts/build-panic-probe.mjs
      - name: Build WASM package, web app, lint, typecheck, and unit tests
        run: |
          bun run --cwd web build:wasm
          bun run --cwd web build
          bun run --cwd web lint
          bun run --cwd web typecheck
          mkdir -p "$RUNNER_TEMP/profile-tests"
          ORCA_SLICER_DIR="$PWD/OrcaSlicer" \
          ARES_PROFILE_TEST_ARTIFACTS="$RUNNER_TEMP/profile-tests" \
            bun run --cwd web test:unit
      - name: Pack prebuilt web and release CLI bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-bundle"
          tar --zstd -cf "$RUNNER_TEMP/web-bundle/web-dist.tar.zst" \
            target/release/ares \
            target/release/examples/print_config_def \
            target/web-e2e \
            web/packages/ares-wasm-js/dist \
            web/packages/ares-profiles/dist \
            web/app/dist
          ls -lh "$RUNNER_TEMP/web-bundle/web-dist.tar.zst"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/web-bundle
          key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}

  web-streaming:
    needs: web-build
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium
          ghcr-token: ${{ github.token }}
      - name: Run desktop-streaming E2E
        run: |
          bunx --cwd web playwright test \
            --config playwright.config.ts \
            --project desktop-streaming \
            --workers 1 --retries 0 \
            --output "$RUNNER_TEMP/web-results/streaming"

  web-desktop:
    name: web-desktop (${{ matrix.shard }}/2)
    needs: web-build
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium
          ghcr-token: ${{ github.token }}
      - name: Run desktop E2E shard ${{ matrix.shard }}/2
        run: |
          bunx --cwd web playwright test \
            --config playwright.config.ts \
            --project desktop \
            --workers 1 --retries 0 \
            --shard="${{ matrix.shard }}/2" \
            --output "$RUNNER_TEMP/web-results/desktop-${{ matrix.shard }}"

  web-packages-mobile:
    needs: web-build
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity')
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium webkit
          ghcr-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Prebuild orca_parity fixture binary for package specs
        run: cargo nextest run --no-run -p ares-cli --test orca_parity
      - name: Run packages E2E (workers=1)
        run: |
          bunx --cwd web playwright test \
            --config playwright.config.ts \
            --project packages \
            --workers 1 --retries 0 \
            --output "$RUNNER_TEMP/web-results/packages"
      - name: Run mobile E2E (iphone, pixel, ipad)
        run: |
          bunx --cwd web playwright test \
            --config playwright.config.ts \
            --project iphone --project pixel --project ipad \
            --workers 1 --retries 0 \
            --output "$RUNNER_TEMP/web-results/mobile"

  tier1-gate:
    name: tier1-gate
    if: always()
    needs:
      - format
      - native-nonparity
      - build-parity
      - parity-official
      - parity-seeded
      - web-build
      - web-streaming
      - web-desktop
      - web-packages-mobile
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required Tier 1 checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_COMPLETE_SUITE: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-full-parity') }}
          RES_FORMAT: ${{ needs.format.result }}
          RES_NONPARITY: ${{ needs.native-nonparity.result }}
          RES_BUILD_PARITY: ${{ needs.build-parity.result }}
          RES_OFFICIAL: ${{ needs.parity-official.result }}
          RES_SEEDED: ${{ needs.parity-seeded.result }}
          RES_WEB_BUILD: ${{ needs.web-build.result }}
          RES_WEB_STREAM: ${{ needs.web-streaming.result }}
          RES_WEB_DESKTOP: ${{ needs.web-desktop.result }}
          RES_WEB_PKGS: ${{ needs.web-packages-mobile.result }}
        run: |
          set -euo pipefail
          check_success() {
            if [ "$2" != "success" ]; then
              echo "FAILED: $1 = $2" >&2
              return 1
            fi
            echo "OK: $1 = $2"
          }
          check_success format "$RES_FORMAT"
          check_success native-nonparity "$RES_NONPARITY"
          if [ "$RUN_COMPLETE_SUITE" = "true" ]; then
            check_success build-parity "$RES_BUILD_PARITY"
            check_success parity-official "$RES_OFFICIAL"
            check_success parity-seeded "$RES_SEEDED"
            check_success web-build "$RES_WEB_BUILD"
            check_success web-streaming "$RES_WEB_STREAM"
            check_success web-desktop "$RES_WEB_DESKTOP"
            check_success web-packages-mobile "$RES_WEB_PKGS"
          fi

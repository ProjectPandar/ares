name: Tier 1

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ORCA_REF: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
  CARGO_INCREMENTAL: "0"

jobs:
  merge-scope:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      run_complete_suite: ${{ steps.select.outputs.run_complete_suite == 'true' && steps.reuse.outputs.reuse_complete_suite != 'true' }}
      reuse_pr_checks: ${{ steps.reuse.outputs.reuse_pr_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: select
        run: bash scripts/ci/select-pr-checks.sh --event merge_group --base "${{ github.event.merge_group.base_sha }}" --github-output "$GITHUB_OUTPUT"
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-merge-group-reuse.sh --workflow tier1 --base "${{ github.event.merge_group.base_sha }}" --github-output "$GITHUB_OUTPUT"
  fast-checks:
    needs: merge-scope
    if: "!cancelled() && (github.event_name != 'merge_group' || (needs.merge-scope.result == 'success' && needs.merge-scope.outputs.reuse_pr_checks != 'true'))"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/checkout-orca-sparse
        with:
          ref: ${{ env.ORCA_REF }}
      - uses: ./.github/actions/setup-web-deps
      - name: Restore cached WASM bindings for TS7 typecheck
        uses: actions/cache/restore@v4
        with:
          path: web/packages/ares-wasm-js/src/wasm
          key: ares-wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/ares-core/**', 'crates/ares-vgcode/**', 'crates/ares-wasm/**', 'vendor/**', 'web/packages/ares-wasm-js/scripts/build-wasm.mjs') }}
      - name: Run merged fast checks with strict latency budgets
        run: ARES_PROFILE_TEST_ARTIFACTS="$RUNNER_TEMP/profile-tests" bash scripts/ci/run-fast-checks.sh
  rust-wasm-check:
    needs: merge-scope
    if: "!cancelled() && (github.event_name != 'merge_group' || (needs.merge-scope.result == 'success' && needs.merge-scope.outputs.reuse_pr_checks != 'true'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Select PR/merge_group scope
        id: select
        run: bash scripts/ci/select-pr-checks.sh --event "${{ github.event_name }}" --base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" --github-output "$GITHUB_OUTPUT"
      - if: steps.select.outputs.run_rust_wasm == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - if: steps.select.outputs.run_rust_wasm == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-wasm-check"
      - name: Check wasm32 targets
        if: steps.select.outputs.run_rust_wasm == 'true'
        run: cargo check --target wasm32-unknown-unknown -p ares-core -p ares-wasm
  rust-clippy:
    needs: merge-scope
    if: "!cancelled() && (github.event_name != 'merge_group' || (needs.merge-scope.result == 'success' && needs.merge-scope.outputs.reuse_pr_checks != 'true'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Select PR/merge_group scope
        id: select
        run: bash scripts/ci/select-pr-checks.sh --event "${{ github.event_name }}" --base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" --github-output "$GITHUB_OUTPUT"
      - if: steps.select.outputs.run_rust_clippy == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - if: steps.select.outputs.run_rust_clippy == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-clippy"
      - name: Run Clippy on selected crates
        if: steps.select.outputs.run_rust_clippy == 'true'
        env:
          RUST_CRATES: ${{ steps.select.outputs.rust_crates }}
        run: bash scripts/ci/run-clippy.sh

  rust-nonparity:
    needs: merge-scope
    if: "!cancelled() && (github.event_name != 'merge_group' || (needs.merge-scope.result == 'success' && needs.merge-scope.outputs.reuse_pr_checks != 'true'))"
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Select PR/merge_group scope
        id: select
        run: bash scripts/ci/select-pr-checks.sh --event "${{ github.event_name }}" --base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" --github-output "$GITHUB_OUTPUT"
      - if: steps.select.outputs.run_rust_nonparity == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
      - if: steps.select.outputs.run_rust_nonparity == 'true'
        uses: taiki-e/install-action@nextest
      - if: steps.select.outputs.run_rust_nonparity == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-nonparity"
      - if: steps.select.outputs.run_rust_nonparity == 'true'
        uses: ./.github/actions/checkout-orca-sparse
        with:
          ref: ${{ env.ORCA_REF }}
      - name: Run selected non-parity tests (excluding orca_parity)
        if: steps.select.outputs.run_rust_nonparity == 'true'
        env:
          RUST_CRATES: ${{ steps.select.outputs.rust_crates }}
        run: bash scripts/ci/run-nonparity-tests.sh

  build-parity:
    needs: merge-scope
    if: "!cancelled() && ((github.event_name == 'merge_group' && needs.merge-scope.outputs.run_complete_suite == 'true') || contains(github.event.pull_request.labels.*.name, 'run-full-parity'))"
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-nonparity"
      - name: Build and archive orca_parity test binary
        run: |
          mkdir -p "$RUNNER_TEMP/parity-archive"
          cargo nextest archive -p ares-cli --test orca_parity --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst"
          cp target/debug/ares "$RUNNER_TEMP/parity-archive/ares"
          bash scripts/ci/verify-parity-shards.sh "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" parity-official 8
          bash scripts/ci/verify-parity-shards.sh "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" parity-seeded 8
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/parity-archive
          key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}

  parity-official:
    name: parity-official (${{ matrix.shard }}/8)
    needs: build-parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-parity-shard
        with:
          mode: official
          archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
          ghcr-token: ${{ github.token }}
      - name: Run parity-official shard ${{ matrix.shard }}/8
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast --test-threads 4 --profile parity-official --partition "hash:${{ matrix.shard }}/8"

  parity-seeded:
    name: parity-seeded (${{ matrix.shard }}/8)
    needs: build-parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-parity-shard
        with:
          mode: seeded
          archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
          ghcr-token: ${{ github.token }}
      - name: Run parity-seeded shard ${{ matrix.shard }}/8
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/parity-archive/orca-parity.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast --test-threads 4 --profile parity-seeded --partition "hash:${{ matrix.shard }}/8"

  web-build:
    needs: merge-scope
    if: "!cancelled() && ((github.event_name == 'merge_group' && needs.merge-scope.outputs.run_complete_suite == 'true') || contains(github.event.pull_request.labels.*.name, 'run-full-parity'))"
    runs-on: ubuntu-latest
    outputs:
      browsers_image: ${{ steps.toolchain.outputs.browsers_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/restore-web-build-artifact
        id: web-artifact
      - name: Resolve pinned CI browser container image
        id: toolchain
        run: bash scripts/ci/toolchain-image.sh verify-pins && echo "browsers_image=$(bash scripts/ci/toolchain-image.sh ref browsers)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/checkout-orca-sparse
        with:
          ref: ${{ env.ORCA_REF }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pages-wasm"
      - uses: ./.github/actions/setup-web-deps
      - uses: ./.github/actions/cache-web-wasm
        if: github.event_name != 'merge_group'
        id: web-wasm
      - uses: taiki-e/install-action@wasm-bindgen-cli
        if: (github.event_name == 'merge_group' && (steps.web-artifact.outputs.wasm-hit != 'true' || steps.web-artifact.outputs.panic-probe-hit != 'true')) || (github.event_name != 'merge_group' && (steps.web-wasm.outputs.wasm-hit != 'true' || steps.web-wasm.outputs.panic-probe-hit != 'true'))
        with:
          tool: wasm-bindgen-cli@0.2.121
      - name: Build CLI, WASM, web app, verify metadata, and pack bundle
        env:
          WASM_CACHE_HIT: ${{ github.event_name == 'merge_group' && steps.web-artifact.outputs.wasm-hit || steps.web-wasm.outputs.wasm-hit }}
          PANIC_PROBE_CACHE_HIT: ${{ github.event_name == 'merge_group' && steps.web-artifact.outputs.panic-probe-hit || steps.web-wasm.outputs.panic-probe-hit }}
        run: bash scripts/ci/run-web-build.sh && bun scripts/ci/balance-web-shards.mjs verify --web-dir web --project desktop --total 4
      - uses: actions/cache/save@v4
        with:
          path: target/ci-web-bundle
          key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clean temporary web bundle before Rust cache save
        run: rm -rf target/ci-web-bundle

  web-streaming:
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium
          ghcr-token: ${{ github.token }}
      - name: Run desktop-streaming E2E
        run: bunx --cwd web playwright test --config playwright.config.ts --project desktop-streaming --workers 1 --retries 0 --output "$RUNNER_TEMP/web-results/streaming"

  web-desktop:
    name: web-desktop (${{ matrix.shard }}/4)
    needs: [web-build, build-parity]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium
          ghcr-token: ${{ github.token }}
          parity-archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/restore-web-timings
      - name: Run timing-balanced desktop E2E shard ${{ matrix.shard }}/4
        run: bash scripts/ci/run-web-desktop-shard.sh "${{ matrix.shard }}" 4
      - name: Save updated web E2E timings on merge_group
        if: github.event_name == 'merge_group'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/web-timings/shard-${{ matrix.shard }}.json
          key: web-desktop-timings-v2-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  web-packages:
    needs: [merge-scope, web-build, build-parity]
    if: "!cancelled() && needs.web-build.result == 'success' && needs.build-parity.result == 'success' && ((github.event_name == 'merge_group' && needs.merge-scope.outputs.run_complete_suite == 'true') || contains(github.event.pull_request.labels.*.name, 'run-full-parity'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-web-shard
        with:
          bundle-key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          browsers: chromium
          ghcr-token: ${{ github.token }}
          parity-archive-key: ci-parity-archive-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run packages E2E (workers=1)
        run: bunx --cwd web playwright test --config playwright.config.ts --project packages --workers 1 --retries 0 --output "$RUNNER_TEMP/web-results/packages"

  web-mobile:
    needs: [merge-scope, web-build]
    if: "!cancelled() && needs.web-build.result == 'success' && ((github.event_name == 'merge_group' && needs.merge-scope.outputs.run_complete_suite == 'true') || contains(github.event.pull_request.labels.*.name, 'run-full-parity'))"
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.web-build.outputs.browsers_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-web-deps
      - uses: actions/cache/restore@v4
        with:
          path: target/ci-web-bundle
          key: ci-web-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Unpack prebuilt web bundle
        run: tar --zstd -xf target/ci-web-bundle/web-dist.tar.zst -C "$GITHUB_WORKSPACE" && rm -rf target/ci-web-bundle
      - name: Run mobile E2E (iphone, pixel, ipad)
        run: bunx --cwd web playwright test --config playwright.config.ts --project iphone --project pixel --project ipad --workers 1 --retries 0 --output "$RUNNER_TEMP/web-results/mobile"

  tier1-gate:
    name: tier1-gate
    if: always()
    needs: [merge-scope, fast-checks, rust-wasm-check, rust-clippy, rust-nonparity, build-parity, parity-official, parity-seeded, web-build, web-streaming, web-desktop, web-packages, web-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required Tier 1 checks
        env:
          IS_MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
          REUSE_PR_CHECKS: ${{ github.event_name == 'merge_group' && needs.merge-scope.outputs.reuse_pr_checks == 'true' }}
          RUN_COMPLETE_SUITE: ${{ (github.event_name == 'merge_group' && needs.merge-scope.outputs.run_complete_suite == 'true') || contains(github.event.pull_request.labels.*.name, 'run-full-parity') }}
          RES_SCOPE: ${{ needs.merge-scope.result }}
          RES_FAST: ${{ needs.fast-checks.result }}
          RES_WASM: ${{ needs.rust-wasm-check.result }}
          RES_CLIPPY: ${{ needs.rust-clippy.result }}
          RES_NONPARITY: ${{ needs.rust-nonparity.result }}
          RES_BUILD_PARITY: ${{ needs.build-parity.result }}
          RES_OFFICIAL: ${{ needs.parity-official.result }}
          RES_SEEDED: ${{ needs.parity-seeded.result }}
          RES_WEB_BUILD: ${{ needs.web-build.result }}
          RES_WEB_STREAM: ${{ needs.web-streaming.result }}
          RES_WEB_DESKTOP: ${{ needs.web-desktop.result }}
          RES_WEB_PKGS: ${{ needs.web-packages.result }}
          RES_WEB_MOBILE: ${{ needs.web-mobile.result }}
        run: |
          set -euo pipefail
          failed=0
          chk() { if [ "$2" != "success" ]; then echo "FAILED: $1 = $2" >&2; failed=1; else echo "OK: $1 = $2"; fi; }
          if [ "$IS_MERGE_GROUP" = "true" ]; then chk merge-scope "$RES_SCOPE"; fi
          if [ "$REUSE_PR_CHECKS" != "true" ]; then
            chk fast-checks "$RES_FAST"; chk rust-wasm-check "$RES_WASM"; chk rust-clippy "$RES_CLIPPY"; chk rust-nonparity "$RES_NONPARITY"
          fi
          if [ "$RUN_COMPLETE_SUITE" = "true" ]; then
            chk build-parity "$RES_BUILD_PARITY"; chk parity-official "$RES_OFFICIAL"; chk parity-seeded "$RES_SEEDED"
            chk web-build "$RES_WEB_BUILD"; chk web-streaming "$RES_WEB_STREAM"; chk web-desktop "$RES_WEB_DESKTOP"; chk web-packages "$RES_WEB_PKGS"; chk web-mobile "$RES_WEB_MOBILE"
          fi
          exit "$failed"

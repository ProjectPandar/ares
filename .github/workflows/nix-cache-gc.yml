# Garbage collection for the hestia binary cache (keeps the repository inside
# GitHub's 10 GB Actions-cache quota). Adapted from Mic92/hestia's
# .github/workflows/gc.yml for a consumer repository: the released binary is
# fetched through the action instead of building hestia from source.
#
# GC must run on the default branch: a PR job's cache scope is read-only
# towards the default branch and dies with the PR, but the default-branch
# scope grows forever without GC.
name: Cache GC

concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    # Daily, off-peak (UTC).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: self-hosted
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc \
            ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

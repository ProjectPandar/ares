name: Setup Web E2E Shard
description: Restore prebuilt web/WASM bundle, Bun, Playwright browsers, and pinned GHCR v2.5.0 oracles
inputs:
  bundle-key:
    description: Actions cache key for prebuilt web and release CLI assets
    required: true
  browsers:
    description: Playwright browsers to install (e.g. "chromium" or "chromium webkit")
    required: true
  ghcr-token:
    description: GitHub token for GHCR login
    required: true
  parity-archive-key:
    description: Optional Actions cache key for the prebuilt orca-parity nextest archive
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/checkout-orca-sparse
      with:
        ref: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
    - uses: ./.github/actions/setup-bun
    - if: inputs.parity-archive-key != ''
      uses: taiki-e/install-action@nextest
    - if: inputs.parity-archive-key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/parity-archive
        key: ${{ inputs.parity-archive-key }}
        fail-on-cache-miss: true
    - name: Place ares binary and expose parity nextest archive
      if: inputs.parity-archive-key != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/target/debug" "$RUNNER_TEMP/enum-artifacts"
        cp "$RUNNER_TEMP/parity-archive/ares" "$GITHUB_WORKSPACE/target/debug/ares"
        chmod +x "$GITHUB_WORKSPACE/target/debug/ares"
        {
          echo "ARES_PARITY_NEXTEST_ARCHIVE=$RUNNER_TEMP/parity-archive/orca-parity.tar.zst"
          echo "ARES_ENUM_ARTIFACTS=$RUNNER_TEMP/enum-artifacts"
        } >> "$GITHUB_ENV"
    - uses: ./.github/actions/setup-web-deps
    - uses: actions/cache/restore@v4
      with:
        path: target/ci-web-bundle
        key: ${{ inputs.bundle-key }}
        fail-on-cache-miss: true
    - name: Unpack prebuilt web and release CLI bundle
      shell: bash
      run: |
        tar --zstd -xf target/ci-web-bundle/web-dist.tar.zst -C "$GITHUB_WORKSPACE"
        rm -rf target/ci-web-bundle
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browsers }}-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
    - name: Install Playwright browsers on cache miss
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bunx --cwd web playwright install ${{ inputs.browsers }}
    - name: Install WebKit system libraries
      if: contains(inputs.browsers, 'webkit')
      shell: bash
      run: bunx --cwd web playwright install-deps webkit
    - name: Cache official OrcaSlicer v2.5.0 AppImage
      uses: actions/cache@v4
      with:
        path: ~/.cache/ares-orca-appimage
        key: orca-appimage-v2.5.0-d13eb0a9cd61
    - name: Fetch official OrcaSlicer v2.5.0 AppImage
      shell: bash
      run: |
        bash scripts/ci/fetch-orca-appimage.sh \
          "$RUNNER_TEMP/orca-appdir" \
          "$HOME/.cache/ares-orca-appimage/orca-v2.5.0.AppImage"
    - name: Restore pinned GHCR v2.5.0 oracles
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: |
        set -euo pipefail
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        bash scripts/ci/restore-oracles.sh \
          --mode web \
          --appdir "$RUNNER_TEMP/orca-appdir" \
          --job-appdir "$RUNNER_TEMP/orca-job-appdir" \
          --env-file "$GITHUB_ENV"
        {
          echo "ORCA_SLICER_DIR=$PWD/OrcaSlicer/"
          echo "ORCA_REPLAY_CPU=0"
          echo "ARES_PARITY_ARTIFACT_ROOT=$RUNNER_TEMP/parity-artifacts"
        } >> "$GITHUB_ENV"

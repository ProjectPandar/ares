name: Web E2E
description: Prepare once, stream diagnostics and keep browser files in the runner workspace only
runs:
  using: composite
  steps:
    - run: npm run prepare:e2e --prefix web
      shell: bash
    - name: Desktop E2E
      run: npm exec --prefix web -- playwright test --config web/playwright.config.ts --project desktop-streaming --project desktop --project packages --workers 1 --trace retain-on-failure --output /tmp/ares-ci-web-${{ github.run_id }}-${{ github.run_attempt }}/desktop
      shell: bash
    - name: Mobile E2E
      if: ${{ !cancelled() }}
      shell: bash
      run: npm exec --prefix web -- playwright test --config web/playwright.config.ts --project iphone --project pixel --project ipad --workers 1 --trace retain-on-failure --output /tmp/ares-ci-web-${{ github.run_id }}-${{ github.run_attempt }}/mobile

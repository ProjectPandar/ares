name: Provision pinned Ares raw profile inputs
description: Select verified OrcaSlicer v2.5.0 release source JSON independently of Native packaging
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: SoftFever/OrcaSlicer
        ref: 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
        path: OrcaProfileSource
        sparse-checkout: resources/profiles
        persist-credentials: false
    - name: Verify profile source identity and export explicit binding
      shell: bash
      run: |
        set -euo pipefail
        source="$GITHUB_WORKSPACE/OrcaProfileSource"
        test "$(git -C "$source" rev-parse HEAD)" = 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19
        test "$(git -C "$source" rev-parse HEAD:resources/profiles)" = 356aeec67e6eb11b0a756c48da789aa6c5f6c19a
        echo "ARES_PARITY_PROFILE_RESOURCES_DIR=$source/resources" >> "$GITHUB_ENV"
        echo "Ares profile source: v2.5.0 / 40ecc66f78ed72dc368e0c1ebe40d77f00cc8a19 / profiles tree 356aeec67e6eb11b0a756c48da789aa6c5f6c19a"

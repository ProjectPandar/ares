name: Restore current-run Native oracles
description: Import exact-run Native outputs and fetch only signed Nixpkgs dependencies
inputs:
  variants:
    description: JSON array of required producer variants
    required: true
runs:
  using: composite
  steps:
    - name: Restore actual-speed-profile
      if: contains(fromJSON(inputs.variants), 'actual-speed-profile')
      id: actual-speed-profile
      uses: actions/cache/restore@v4
      with:
        key: native-oracle-closure-${{ github.run_id }}-actual-speed-profile
        path: ${{ runner.temp }}/native-oracle-caches/actual-speed-profile
        fail-on-cache-miss: true
    - name: Require exact actual-speed-profile cache
      if: contains(fromJSON(inputs.variants), 'actual-speed-profile') && steps.actual-speed-profile.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::error::Missing exact current-run Native cache: actual-speed-profile" >&2
        exit 1

[package]
name = "plugin-spike-host"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["interpreter"]
files = ["interpreter"]
interpreter = ["dep:wasmi"]
jit = ["dep:wasmtime", "dep:wat"]
metering = ["dep:wasm-encoder", "dep:wasmparser"]
direct-boa = ["dep:plugin-spike-js", "plugin-spike-js/boa"]
direct-quickjs = ["dep:plugin-spike-js", "plugin-spike-js/quickjs"]

[dependencies]
plugin-spike-api = { path = "../api" }
plugin-spike-js = { path = "../js", optional = true }
plugin-spike-samples = { path = "../samples" }
anyhow = "1"
plugin-spike-wire = { path = "../wire" }
wasm-encoder = { version = "=0.263.0", default-features = false, optional = true }
wasmparser = { version = "=0.263.0", default-features = false, features = ["features", "validate"], optional = true }
wasmi = { version = "=2.0.3", default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "deterministic"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "=51.0.0", default-features = false, features = ["anyhow", "runtime", "cranelift", "component-model"], optional = true }
wat = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[[bin]]
name = "bench-plugin"
path = "src/main.rs"
